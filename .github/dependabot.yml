# Dependabot: keep pnpm (frontend) and cargo (Rust) deps current.
# Runs weekly; groups minor/patch to reduce PR noise.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      production-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    groups:
      rust-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
