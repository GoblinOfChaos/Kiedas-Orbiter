name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update || sudo apt-get update
          sudo apt-get install -y --fix-missing \
            pkg-config \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            clang \
            lld \
            libasound2-dev \
            libssl-dev \
            libdbus-1-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libarchive-dev \
            libicu-dev \
            libcap-dev

      - name: Build API Helper (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          bash helpers/build_linux.sh
          strip src-tauri/data/bin/warframe-api-helper

      - name: Build API Helper (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          bash helpers/build_macos.sh

      - name: Build API Helper (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          bash helpers/build_win.sh

      - name: Build and Bundle Portable Tesseract (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          mkdir -p src-tauri/data/bin
          # Copy the binary
          cp $(which tesseract) src-tauri/data/bin/tesseract
          # Copy all shared library dependencies (.so files) EXCEPT core system libs like libc,
          # as bundling them causes major version conflicts on newer/older host distros.
          ldd $(which tesseract) | grep "=> /" | grep -vE "libc\.so|libm\.so|libdl\.so|libpthread\.so|librt\.so|libgcc_s\.so|libstdc\+\+\.so|libresolv\.so|libutil\.so|libcrypt\.so" | awk '{print $3}' | xargs -I {} readlink -f {} | xargs -I {} cp -L {} src-tauri/data/bin/
          chmod +x src-tauri/data/bin/tesseract

      - name: Install and copy Tesseract (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install tesseract dylibbundler
          mkdir -p src-tauri/data/bin
          cp $(which tesseract) src-tauri/data/bin/tesseract
          chmod +x src-tauri/data/bin/tesseract
          dylibbundler -b -x src-tauri/data/bin/tesseract -d src-tauri/data/bin/ -p @executable_path/

      - name: Build and Bundle Portable Tesseract (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          # 1. Install Tesseract via Chocolatey
          choco install tesseract -y
          
          # 2. Get the installation path (usually C:\Program Files\Tesseract-OCR)
          TESS_PATH="/c/Program Files/Tesseract-OCR"
          
          # 3. Copy the executable and all DLLs to your bin folder
          mkdir -p src-tauri/data/bin
          cp "$TESS_PATH/tesseract.exe" src-tauri/data/bin/
          cp "$TESS_PATH"/*.dll src-tauri/data/bin/
          
          # 4. Copy the English data file
          mkdir -p src-tauri/data/bin/tessdata
          cp "$TESS_PATH/tessdata/eng.traineddata" src-tauri/data/bin/tessdata/

      - name: Prepare Tauri Binaries Directory
        shell: bash
        run: mkdir -p src-tauri/data/bin
  
      - name: Download Warframe-Exporter-CLI (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          curl -L "https://github.com/Puxtril/Warframe-Exporter/releases/download/v2.14/Warframe-Exporter-CLI_Windows.exe" \
            -o src-tauri/data/bin/Warframe-Exporter-CLI.exe

      - name: Download Warframe-Exporter-CLI (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          curl -L "https://github.com/Puxtril/Warframe-Exporter/releases/download/v2.14/Warframe-Exporter-CLI_Linux.AppImage" \
            -o src-tauri/data/bin/Warframe-Exporter-CLI
          chmod +x src-tauri/data/bin/Warframe-Exporter-CLI

      - name: Install frontend dependencies
        run: pnpm install

      - name: Verify icons (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          echo "=== Icon files ==="
          ls -la src-tauri/icons/icon.ico
          file src-tauri/icons/icon.ico
          echo ""
          echo "=== tauri.conf.json icon section ==="
          grep -A 10 '"icon"' src-tauri/tauri.conf.json
          echo ""
          echo "=== CLI version ==="
          npx tauri --version
          echo ""
          echo "=== Rust version ==="
          rustc --version

      - name: Build and Release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          RUST_BACKTRACE: full
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Cephalon Kronos ${{ github.ref_name }}'
          releaseBody: 'See the attached assets for the release binaries.'
          releaseDraft: true
          prerelease: false
          uploadPlainBinary: true

  generate-updater-json:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate updater.json
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/glowseeker/cephalon-kronos/releases/download/$TAG"

          # Download signature files from the release
          mkdir -p /tmp/sigs
          gh release download "$TAG" --pattern "*.sig" --dir /tmp/sigs --clobber 2>/dev/null || true

          # Build updater.json with jq
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg base_url "$BASE_URL" \
            --arg win_sig "$(cat /tmp/sigs/Cephalon-Kronos_${VERSION}_x64-setup.exe.sig 2>/dev/null || echo '')" \
            --arg mac_x64_sig "$(cat /tmp/sigs/Cephalon-Kronos_${VERSION}_x64.dmg.sig 2>/dev/null || echo '')" \
            --arg mac_aarch64_sig "$(cat /tmp/sigs/Cephalon-Kronos_${VERSION}_aarch64.dmg.sig 2>/dev/null || echo '')" \
            --arg linux_sig "$(cat /tmp/sigs/Cephalon-Kronos_${VERSION}_amd64.AppImage.sig 2>/dev/null || echo '')" \
            --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              version: $version,
              notes: ("Release " + $tag),
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": {
                  signature: $win_sig,
                  url: ($base_url + "/Cephalon-Kronos_" + $version + "_x64-setup.exe")
                },
                "darwin-x86_64": {
                  signature: $mac_x64_sig,
                  url: ($base_url + "/Cephalon-Kronos_" + $version + "_x64.dmg")
                },
                "darwin-aarch64": {
                  signature: $mac_aarch64_sig,
                  url: ($base_url + "/Cephalon-Kronos_" + $version + "_aarch64.dmg")
                },
                "linux-x86_64": {
                  signature: $linux_sig,
                  url: ($base_url + "/Cephalon-Kronos_" + $version + "_amd64.AppImage")
                }
              }
            }' > updater.json

          gh release upload "$TAG" updater.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
