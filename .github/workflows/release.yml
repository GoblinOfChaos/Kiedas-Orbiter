name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # package.json's version drives both the built app's self-reported
      # version (tauri.conf.json points "version" at package.json) and the
      # Tauri updater's "am I outdated" comparison. Letting it drift from the
      # release tag makes update checks permanently wrong in one direction
      # or the other - confirmed live: package.json sat at 0.7.0 across
      # several 1.x tags, so every install of every release still compared
      # itself as older than the latest release and re-offered the same
      # "update" forever, even immediately after actually updating.
      - name: Sync package.json/Cargo.toml version to the release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          sed -i.bak "0,/^version = \".*\"/s//version = \"$VERSION\"/" src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update || sudo apt-get update
          sudo apt-get install -y --fix-missing \
            pkg-config \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            clang \
            lld \
            libasound2-dev \
            libssl-dev \
            libdbus-1-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libarchive-dev \
            libicu-dev \
            libcap-dev \
            libayatana-appindicator3-dev \
            squashfs-tools \
            fuse

      - name: Prepare Tauri Binaries Directory
        shell: bash
        run: mkdir -p src-tauri/data/bin
  
      - name: Download Warframe-Exporter-CLI (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          curl -L "https://github.com/Puxtril/Warframe-Exporter/releases/download/v2.14/Warframe-Exporter-CLI_Windows.exe" \
            -o src-tauri/data/bin/Warframe-Exporter-CLI.exe

      - name: Download Warframe-Exporter-CLI (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        shell: bash
        run: |
          curl -L "https://github.com/Puxtril/Warframe-Exporter/releases/download/v2.14/Warframe-Exporter-CLI_Linux.AppImage" \
            -o /tmp/Warframe-Exporter-CLI.AppImage
          chmod +x /tmp/Warframe-Exporter-CLI.AppImage
          # Extract the AppImage so we bundle a plain ELF (avoid nested AppImage issues)
          /tmp/Warframe-Exporter-CLI.AppImage --appimage-extract > /dev/null 2>&1
          # Find the actual binary inside the extracted squashfs
          BIN=$(find squashfs-root -type f -executable 2>/dev/null | head -1)
          if [ -n "$BIN" ]; then
            cp "$BIN" src-tauri/data/bin/Warframe-Exporter-CLI
            chmod +x src-tauri/data/bin/Warframe-Exporter-CLI
          else
            # Fallback: if extraction didn't work, use the AppImage as-is
            cp /tmp/Warframe-Exporter-CLI.AppImage src-tauri/data/bin/Warframe-Exporter-CLI
            chmod +x src-tauri/data/bin/Warframe-Exporter-CLI
          fi
          rm -rf squashfs-root /tmp/Warframe-Exporter-CLI.AppImage

      - name: Install frontend dependencies
        run: pnpm install

      - name: Verify icons (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          echo "=== Icon files ==="
          ls -la src-tauri/icons/icon.ico
          file src-tauri/icons/icon.ico
          echo ""
          echo "=== tauri.conf.json icon section ==="
          grep -A 10 '"icon"' src-tauri/tauri.conf.json
          echo ""
          echo "=== CLI version ==="
          npx tauri --version
          echo ""
          echo "=== Rust version ==="
          rustc --version

      - name: Build and Release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri v2's CLI reads TAURI_SIGNING_PRIVATE_KEY(_PASSWORD), not the
          # v1 names TAURI_PRIVATE_KEY/TAURI_KEY_PASSWORD this workflow (and
          # upstream Kronos, which predates this fork's Tauri v2 migration)
          # still used. Confirmed live: every platform's build logged
          # "Signature not found for the updater JSON. Skipping upload" and
          # shipped with an empty signature - Windows/macOS updates would
          # have failed verification, silently, on every install.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          RUST_BACKTRACE: full
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Kieda's Orbiter ${{ github.ref_name }}"
          releaseBody: 'See the attached assets for the release binaries.'
          releaseDraft: true
          prerelease: false
          uploadPlainBinary: false

      # Patch AppRun to preload system libwayland-client, working around
      # a Tauri AppImage EGL_BAD_PARAMETER bug on rolling-release distros.
      # See https://github.com/tauri-apps/tauri/pull/12491 for upstream fix.
      - name: Patch AppImage - work around EGL_BAD_PARAMETER via LD_PRELOAD
        if: matrix.platform == 'ubuntu-24.04'
        shell: bash
        env:
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          # Use wildcard to find the AppImage regardless of space/hyphen in product name
          APPIMAGE_DIR="src-tauri/target/release/bundle/appimage"
          APPIMAGE_FILE=$(ls "$GITHUB_WORKSPACE/$APPIMAGE_DIR"/*.AppImage 2>/dev/null | head -1) || { echo "No AppImage found"; exit 1; }
          APPIMAGE="$APPIMAGE_DIR/$(basename "$APPIMAGE_FILE")"

          # Download appimagetool for repacking
          curl -fsSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -o /tmp/appimagetool
          chmod +x /tmp/appimagetool

          # Extract
          mkdir -p /tmp/appimage-patch
          cd /tmp/appimage-patch
          "$APPIMAGE_FILE" --appimage-extract > /dev/null 2>&1

          # Tauri/linuxdeploy's default AppImage packaging puts app resources
          # under usr/lib/<productName> ("Kieda's Orbiter", from tauri.conf.json),
          # but Tauri resolves BaseDirectory::Resource at runtime as
          # $APPIMAGE_DIR/usr/lib/<binary-name> ("kiedas-orbiter", from
          # Cargo.toml) - a different string. Confirmed live: a v1.3.4 install
          # built by this exact pipeline shipped with every resource-backed
          # UI element (bounty portraits/rotation labels, etc.) silently blank,
          # because the running binary looked in a directory that didn't exist.
          # scripts/rebuild-appimage.sh already works around this for local
          # builds by writing resources straight to the right path; do the
          # equivalent here by renaming the directory before repacking.
          WRONG_RESOURCE_DIR=$(find squashfs-root/usr/lib -maxdepth 1 -mindepth 1 -type d ! -name kiedas-orbiter | head -1)
          if [ -n "$WRONG_RESOURCE_DIR" ] && [ ! -d squashfs-root/usr/lib/kiedas-orbiter ]; then
            echo "Relocating resources: $WRONG_RESOURCE_DIR -> squashfs-root/usr/lib/kiedas-orbiter"
            mv "$WRONG_RESOURCE_DIR" squashfs-root/usr/lib/kiedas-orbiter
          fi
          test -f squashfs-root/usr/lib/kiedas-orbiter/data/assets/data/wiki-baro-acquisition.json || { echo "Resource relocation failed - wiki-baro-acquisition.json not found at the expected path"; exit 1; }

          # Patch AppRun to use system libwayland-client to work around
          # Tauri AppImage EGL_BAD_PARAMETER bug on rolling-release distros.
          # See https://github.com/tauri-apps/tauri/pull/12491 for upstream fix.
          cat > /tmp/preload-snippet.sh << 'EOF'
          for libpath in /usr/lib/x86_64-linux-gnu/libwayland-client.so.0 /usr/lib64/libwayland-client.so.0 /usr/lib/libwayland-client.so.0 /lib64/libwayland-client.so.0; do
            [ -f "$libpath" ] && export LD_PRELOAD="$libpath" && break
          done
          EOF
          sed -i '2r /tmp/preload-snippet.sh' squashfs-root/AppRun

          # Repack
          PATCHED="/tmp/Kiedas-Orbiter_${VERSION}_amd64.AppImage"
          /tmp/appimagetool --comp zstd squashfs-root "$PATCHED" 2>&1
          chmod +x "$PATCHED"

          # Sign with Tauri updater key
          cd "$GITHUB_WORKSPACE"
          # Clean key: strip whitespace and fix base64 padding
          printf '%s' "${{ secrets.TAURI_PRIVATE_KEY }}" > /tmp/tauri-key
          KEY=$(tr -d '\r\n ' < /tmp/tauri-key)
          MOD=$(( ${#KEY} % 4 ))
          if [ $MOD -eq 2 ]; then KEY="${KEY}=="; fi
          if [ $MOD -eq 3 ]; then KEY="${KEY}="; fi
          pnpm exec tauri signer sign \
            --private-key "$KEY" \
            --password "$TAURI_KEY_PASSWORD" \
            "$PATCHED"

          # Replace original in bundle dir so gh release upload picks it up
          cp "$PATCHED" "$APPIMAGE_FILE"
          cp "${PATCHED}.sig" "${APPIMAGE_FILE}.sig"

          # Upload patched AppImage + new sig, replacing what tauri-action uploaded
          gh release upload "$TAG" \
            "$APPIMAGE_FILE" \
            "${APPIMAGE_FILE}.sig" \
            --clobber

  generate-updater-json:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate updater.json
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/GoblinOfChaos/Kiedas-Orbiter/releases/download/$TAG"

          # Download all sig and binary name info from the release
          mkdir -p /tmp/sigs
          gh release download "$TAG" --pattern "*.sig" --dir /tmp/sigs --clobber 2>/dev/null || true

          # Helper: find a sig file by a unique keyword (handles space/hyphen variants)
          get_sig() {
            local keyword="$1"
            local file
            file=$(find /tmp/sigs -maxdepth 1 -name "*${keyword}*" -type f 2>/dev/null | head -1)
            if [ -n "$file" ]; then
              cat "$file"
            fi
          }

          # Helper: resolve the actual asset filename for a platform from the sig filename.
          # tauri-action derives the filename from productName ("Kieda's Orbiter"),
          # sanitized differently across versions/platforms. We derive it from
          # whatever file is actually on the release rather than guessing.
          resolve_asset() {
            local keyword="$1"
            local sig_file
            sig_file=$(find /tmp/sigs -maxdepth 1 -name "*${keyword}*" -type f 2>/dev/null | head -1)
            if [ -n "$sig_file" ]; then
              # Strip .sig suffix to get the binary name
              basename "$sig_file" .sig
            else
              # Fallback – use hyphens as the canonical form
              case "$keyword" in
                x64_en-US.msi*)  echo "Kiedas-Orbiter_${VERSION}_x64_en-US.msi" ;;
                x64.dmg*)        echo "Kiedas-Orbiter_${VERSION}_x64.dmg" ;;
                aarch64.dmg*)    echo "Kiedas-Orbiter_${VERSION}_aarch64.dmg" ;;
                AppImage*)       echo "Kiedas-Orbiter_${VERSION}_amd64.AppImage" ;;
              esac
            fi
          }

          WIN_ASSET=$(resolve_asset 'x64_en-US.msi')
          MAC_X64_ASSET=$(resolve_asset 'x64.dmg')
          MAC_ARM_ASSET=$(resolve_asset 'aarch64.dmg')
          LINUX_ASSET=$(resolve_asset 'AppImage')

          # Build updater.json with jq – derive platform URLs from the actual asset names
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg base_url "$BASE_URL" \
            --arg win_sig "$(get_sig 'x64_en-US.msi')" \
            --arg mac_x64_sig "$(get_sig 'x64.dmg')" \
            --arg mac_aarch64_sig "$(get_sig 'aarch64.dmg')" \
            --arg linux_sig "$(get_sig 'AppImage')" \
            --arg win_url "$BASE_URL/$WIN_ASSET" \
            --arg mac_x64_url "$BASE_URL/$MAC_X64_ASSET" \
            --arg mac_arm_url "$BASE_URL/$MAC_ARM_ASSET" \
            --arg linux_url "$BASE_URL/$LINUX_ASSET" \
            --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              version: $version,
              notes: ("Release " + $tag),
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": {
                  signature: $win_sig,
                  url: $win_url
                },
                "darwin-x86_64": {
                  signature: $mac_x64_sig,
                  url: $mac_x64_url
                },
                "darwin-aarch64": {
                  signature: $mac_aarch64_sig,
                  url: $mac_arm_url
                },
                "linux-x86_64": {
                  signature: $linux_sig,
                  url: $linux_url
                }
              }
            }' > updater.json

          gh release upload "$TAG" updater.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}