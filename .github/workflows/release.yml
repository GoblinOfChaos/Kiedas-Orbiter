name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update || sudo apt-get update
          sudo apt-get install -y --fix-missing \
            pkg-config \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            clang \
            lld \
            libasound2-dev \
            libssl-dev \
            libdbus-1-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libarchive-dev \
            libicu-dev \
            libcap-dev \
            libayatana-appindicator3-dev \
            squashfs-tools \
            fuse

      - name: Build API Helper (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          bash helpers/build_linux.sh
          strip src-tauri/data/bin/warframe-api-helper

      - name: Build API Helper (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          bash helpers/build_macos.sh

      - name: Build API Helper (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          bash helpers/build_win.sh

      - name: Prepare Tauri Binaries Directory
        shell: bash
        run: mkdir -p src-tauri/data/bin
  
      - name: Download Warframe-Exporter-CLI (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          curl -L "https://github.com/Puxtril/Warframe-Exporter/releases/download/v2.14/Warframe-Exporter-CLI_Windows.exe" \
            -o src-tauri/data/bin/Warframe-Exporter-CLI.exe

      - name: Download Warframe-Exporter-CLI (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        shell: bash
        run: |
          curl -L "https://github.com/Puxtril/Warframe-Exporter/releases/download/v2.14/Warframe-Exporter-CLI_Linux.AppImage" \
            -o /tmp/Warframe-Exporter-CLI.AppImage
          chmod +x /tmp/Warframe-Exporter-CLI.AppImage
          # Extract the AppImage so we bundle a plain ELF (avoid nested AppImage issues)
          /tmp/Warframe-Exporter-CLI.AppImage --appimage-extract > /dev/null 2>&1
          # Find the actual binary inside the extracted squashfs
          BIN=$(find squashfs-root -type f -executable 2>/dev/null | head -1)
          if [ -n "$BIN" ]; then
            cp "$BIN" src-tauri/data/bin/Warframe-Exporter-CLI
            chmod +x src-tauri/data/bin/Warframe-Exporter-CLI
          else
            # Fallback: if extraction didn't work, use the AppImage as-is
            cp /tmp/Warframe-Exporter-CLI.AppImage src-tauri/data/bin/Warframe-Exporter-CLI
            chmod +x src-tauri/data/bin/Warframe-Exporter-CLI
          fi
          rm -rf squashfs-root /tmp/Warframe-Exporter-CLI.AppImage

      - name: Install frontend dependencies
        run: pnpm install

      - name: Verify icons (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          echo "=== Icon files ==="
          ls -la src-tauri/icons/icon.ico
          file src-tauri/icons/icon.ico
          echo ""
          echo "=== tauri.conf.json icon section ==="
          grep -A 10 '"icon"' src-tauri/tauri.conf.json
          echo ""
          echo "=== CLI version ==="
          npx tauri --version
          echo ""
          echo "=== Rust version ==="
          rustc --version

      - name: Build and Release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          RUST_BACKTRACE: full
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Cephalon Kronos ${{ github.ref_name }}'
          releaseBody: 'See the attached assets for the release binaries.'
          releaseDraft: true
          prerelease: false
          uploadPlainBinary: true

      # Strip ABI-volatile libs from the AppImage that cause symbol conflicts on
      # rolling-release distros (Arch/CachyOS). webkit2gtk and javascriptcoregtk
      # are Tauri-documented runtime deps so every Linux user has them.
      # libavif+libsharpyuv must be matched to the system Mesa/codec chain or
      # eglGetPlatformDisplayEXT fails with EGL_BAD_PARAMETER.
      - name: Patch AppImage - strip conflicting system libs
        if: matrix.platform == 'ubuntu-24.04'
        shell: bash
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          # Use wildcard to find the AppImage regardless of space/hyphen in product name
          APPIMAGE_DIR="src-tauri/target/release/bundle/appimage"
          APPIMAGE_FILE=$(ls "$GITHUB_WORKSPACE/$APPIMAGE_DIR"/*.AppImage 2>/dev/null | head -1) || { echo "No AppImage found"; exit 1; }
          APPIMAGE="$APPIMAGE_DIR/$(basename "$APPIMAGE_FILE")"

          # Download appimagetool for repacking
          curl -fsSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -o /tmp/appimagetool
          chmod +x /tmp/appimagetool

          # Extract
          mkdir -p /tmp/appimage-patch
          cd /tmp/appimage-patch
          "$APPIMAGE_FILE" --appimage-extract > /dev/null 2>&1

          # Strip libs that must come from the system to match its EGL/codec ABI.
          # webkit2gtk + javascriptcoregtk: required system deps per Tauri docs.
          # libavif + libsharpyuv: must be a matched pair with system Mesa.
          LIBS=(
            "libwebkit2gtk-4.1.so.0"
            "libjavascriptcoregtk-4.1.so.0"
            "libavif.so.16"
            "libsharpyuv.so.0"
          )
          for lib in "${LIBS[@]}"; do
            find squashfs-root -name "$lib" -delete && echo "Removed $lib" || echo "Not found: $lib"
          done

          # Repack
          PATCHED="/tmp/Cephalon-Kronos_${VERSION}_amd64.AppImage"
          /tmp/appimagetool --comp gzip squashfs-root "$PATCHED" 2>&1
          chmod +x "$PATCHED"

          # Sign with Tauri updater key
          cd "$GITHUB_WORKSPACE"
          pnpm exec tauri signer sign \
            --private-key "$TAURI_PRIVATE_KEY" \
            --password "$TAURI_KEY_PASSWORD" \
            "$PATCHED"

          # Replace original in bundle dir so gh release upload picks it up
          cp "$PATCHED" "$APPIMAGE_FILE"
          cp "${PATCHED}.sig" "${APPIMAGE_FILE}.sig"

          # Upload patched AppImage + new sig, replacing what tauri-action uploaded
          gh release upload "$TAG" \
            "$APPIMAGE_FILE" \
            "${APPIMAGE_FILE}.sig" \
            --clobber

  generate-updater-json:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate updater.json
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/glowseeker/cephalon-kronos/releases/download/$TAG"

          # Download signature files from the release
          mkdir -p /tmp/sigs
          gh release download "$TAG" --pattern "*.sig" --dir /tmp/sigs --clobber 2>/dev/null || true

          # Build updater.json with jq
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg base_url "$BASE_URL" \
            --arg win_sig "$(cat /tmp/sigs/Cephalon-Kronos_${VERSION}_x64-setup.exe.sig 2>/dev/null || echo '')" \
            --arg mac_x64_sig "$(cat /tmp/sigs/Cephalon-Kronos_${VERSION}_x64.dmg.sig 2>/dev/null || echo '')" \
            --arg mac_aarch64_sig "$(cat /tmp/sigs/Cephalon-Kronos_${VERSION}_aarch64.dmg.sig 2>/dev/null || echo '')" \
            --arg linux_sig "$(cat /tmp/sigs/Cephalon-Kronos_${VERSION}_amd64.AppImage.sig 2>/dev/null || echo '')" \
            --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              version: $version,
              notes: ("Release " + $tag),
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": {
                  signature: $win_sig,
                  url: ($base_url + "/Cephalon-Kronos_" + $version + "_x64-setup.exe")
                },
                "darwin-x86_64": {
                  signature: $mac_x64_sig,
                  url: ($base_url + "/Cephalon-Kronos_" + $version + "_x64.dmg")
                },
                "darwin-aarch64": {
                  signature: $mac_aarch64_sig,
                  url: ($base_url + "/Cephalon-Kronos_" + $version + "_aarch64.dmg")
                },
                "linux-x86_64": {
                  signature: $linux_sig,
                  url: ($base_url + "/Cephalon-Kronos_" + $version + "_amd64.AppImage")
                }
              }
            }' > updater.json

          gh release upload "$TAG" updater.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}