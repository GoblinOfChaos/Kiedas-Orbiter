[package]
name = "wfinfo-ng"
version = "0.1.0"
edition = "2021"
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "wfinfo"
path = "src/lib.rs"

[[bin]]
name = "orbiter"
path = "src/bin/main.rs"
# Binary was previously named 'wfinfo' - renamed to 'orbiter' for Kieda's Orbiter

[[bin]]
name = "ability-timer"
path = "src/bin/ability-timer.rs"
required-features = ["dev-tools"]

[[bin]]
name = "check_image"
path = "src/bin/check_image.rs"
required-features = ["dev-tools"]

[[bin]]
name = "image"
path = "src/bin/image.rs"
required-features = ["dev-tools"]

[[bin]]
name = "relics"
path = "src/bin/relics.rs"
required-features = ["dev-tools"]

[[bin]]
name = "theme_tune"
path = "src/bin/theme_tune.rs"
required-features = ["dev-tools"]

[features]
default = []
dev-tools = ["dep:eframe", "dep:egui_extras", "dep:indexmap", "dep:rdev"]

[dependencies]
anyhow = "1.0.63"
approx = "0.5.1"
clap = { version = "4.5.1", features = ["derive"] }
eframe = { version = "0.19.0", optional = true }
egui_extras = { version = "0.19.0", optional = true }
global-hotkey = "0.4.2"
image = "0.25.10"
indexmap = { version = "2.14.0", features = ["serde"], optional = true }
lazy_static = "1.4.0"
levenshtein = "1.0.5"
notify = "8.2.0"
ordered-float = { version = "3.0.0", features = ["serde"] }
palette = "0.6.1"
rayon = "1.5.3"
rdev = { version = "0.5.3", optional = true }
serde = { version = "1.0.144", features = ["serde_derive"] }
serde-aux = "3.1.0"
serde_json = "1.0.85"
ocr-rs = "2"
log = "0.4.22"
env_logger = "0.11.5"
reqwest = { version = "0.12.7", features = ["blocking"] }
xcap = "=0.0.4"
