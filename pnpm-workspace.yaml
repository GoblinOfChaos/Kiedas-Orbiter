packages:
  - '.'
# pnpm 11+ reads these from this file (not .npmrc). Keeps no-TTY
# `pnpm run preview:build` from working without per-command env hacks.
verifyDepsBeforeRun: false
confirmModulesPurge: false
allowBuilds:
  es5-ext: true
  esbuild: true
minimumReleaseAgeExclude:
  - '@wfcd/items@1.1275.90'
  - '@tauri-apps/plugin-http@2.8.0'
  - '@tauri-apps/plugin-updater@2.13.1'
overrides:
  js-yaml: ^4.3.1
