[package]
name = "cephalon-kronos"
version = "0.6.0"
description = "A cross-platform desktop companion for Warframe"
authors = ["glowseeker"]
license = ""
repository = ""
edition = "2021"
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
webkit2gtk-nvidia-quirk = { version = "1.3" }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }

xcap = "0.4"
levenshtein = "1.0"
image = "0.25"
imageproc = "0.25"
chrono = "0.4"
ocr-rs = "2.2"
ort = { version = "2.0.0-rc.12", features = ["load-dynamic", "copy-dylibs"] }
active-win-pos-rs = "0.10.1"
ndarray = "0.17.2"


[target.'cfg(windows)'.dependencies]
winreg = "0.52"


[[bin]]
name = "cephalon-kronos"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.24"
objc = "0.2.7"

[features]
dev = []
